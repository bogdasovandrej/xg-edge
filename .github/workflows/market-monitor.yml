name: Market monitor

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: xgedge-data-writers
  cancel-in-progress: false

jobs:
  capture:
    outputs:
      data_changed: ${{ steps.publish.outputs.changed }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check configuration
        id: config
        env:
          ODDS_API_IO_KEY: ${{ secrets.ODDS_API_IO_KEY }}
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
          ODDS_API_IO_BOOKMAKERS: ${{ vars.ODDS_API_IO_BOOKMAKERS }}
        shell: bash
        run: |
          if [ -n "$ODDS_API_IO_KEY" ] || [ -n "$THE_ODDS_API_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "ODDS_API_IO_KEY and THE_ODDS_API_KEY are not configured; market capture skipped"
          fi
      - uses: actions/setup-python@v5
        if: steps.config.outputs.enabled == 'true'
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        if: steps.config.outputs.enabled == 'true'
        run: pip install -e .[dev]
      - name: Capture opening or closing-window odds
        if: steps.config.outputs.enabled == 'true'
        env:
          ODDS_API_IO_KEY: ${{ secrets.ODDS_API_IO_KEY }}
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
          ODDS_API_IO_BOOKMAKERS: ${{ vars.ODDS_API_IO_BOOKMAKERS }}
        run: >-
          python scripts/capture_bookmaker_odds.py
          --fixtures reports/live/current_fixtures.json
          --top-five-fixtures reports/live/top5_fixtures.json
          --live-payload reports/live_predictions.json
          --ledger reports/live/prospective_clv.json
          --ledger-v2 reports/live/prospective_clv_v2.json
          --snapshot-output reports/live/bookmaker_odds.json
          ${{ github.event_name == 'workflow_dispatch' && '--force' || '' }}
      - name: Record quote history and screen for movement
        if: steps.config.outputs.enabled == 'true'
        run: >-
          python scripts/record_quotes.py
          --snapshot reports/live/bookmaker_odds.json
          --database reports/live/xgedge.db
          --feed-output reports/live/screener_feed.json
      - name: Update PAPER strategy ledger
        if: steps.config.outputs.enabled == 'true'
        run: >-
          python scripts/update_paper_trading.py
          --ledger reports/live/paper_trading.json
          --live-payload reports/live_predictions.json
          --prospective-ledger reports/live/prospective_clv.json
      - name: Mirror value calcs and settlements into the journal
        if: steps.config.outputs.enabled == 'true'
        run: >-
          python scripts/update_journal.py
          --live-payload reports/live_predictions.json
          --paper-ledger reports/live/paper_trading.json
          --prospective-ledger reports/live/prospective_clv.json
          --database reports/live/xgedge.db
          --calibration-output reports/live/calibration.json
      - name: Validate ledger
        if: steps.config.outputs.enabled == 'true'
        run: python -m pytest -q tests/test_bookmaker_odds.py tests/test_prospective.py tests/test_prospective_v2.py tests/test_capture_bookmaker_odds.py tests/test_paper_markets.py tests/test_paper_simulation.py tests/test_paper_ledger.py tests/test_update_paper_trading.py
      - name: Publish snapshots
        id: publish
        if: steps.config.outputs.enabled == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/live/prospective_clv.json reports/live/prospective_clv_v2.json reports/live/paper_trading.json reports/live_predictions.json
          if [ -f reports/live/bookmaker_odds.json ]; then
            git add reports/live/bookmaker_odds.json
          fi
          # The price-history store and its screened feed. Every writer shares
          # the xgedge-data-writers concurrency group, so only one process
          # ever appends to the SQLite file.
          for artefact in reports/live/xgedge.db reports/live/screener_feed.json reports/live/calibration.json; do
            if [ -f "$artefact" ]; then
              git add "$artefact"
            fi
          done
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No market-data changes"
          else
            git commit -m "data: capture bookmaker odds and prospective CLV"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  deploy-pages:
    needs: capture
    if: needs.capture.outputs.data_changed == 'true'
    uses: ./.github/workflows/pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
